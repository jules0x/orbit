<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="favOrbit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="favOrbit2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="favPlanet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favTileBg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Outer Orbital Ring (-32 deg) -->
  <ellipse cx="32" cy="32" rx="23" ry="8" transform="rotate(-32 32 32)" fill="none" stroke="url(#favOrbit1)" stroke-width="2.6" stroke-dasharray="32 8 16 6" stroke-linecap="round" opacity="0.95"/>

  <!-- Counter Orbital Ring (+42 deg) -->
  <ellipse cx="32" cy="32" rx="18" ry="6.8" transform="rotate(42 32 32)" fill="none" stroke="url(#favOrbit2)" stroke-width="2.2" stroke-dasharray="22 7" stroke-linecap="round" opacity="0.85"/>

  <!-- Central Planet Core -->
  <circle cx="32" cy="32" r="8" fill="url(#favPlanet)" filter="url(#favGlow)"/>
  <circle cx="29.5" cy="29.5" r="5.5" fill="#bfdbfe" opacity="0.45"/>

  <!-- Orbiting Satellites -->
  <circle cx="48" cy="20" r="3" fill="#38bdf8" filter="url(#favGlow)"/>
  <circle cx="17" cy="44" r="2.4" fill="#34d399" filter="url(#favGlow)"/>
  <circle cx="43" cy="44" r="1.8" fill="#c084fc"/>
</svg>
